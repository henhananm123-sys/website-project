# Storage מדומה לבדיקות — nginx סטטי על פורט 9000
# מממש את חוזה הממשק בצורה מינימלית:
#   GET /api/manifest.json -> קובץ JSON סטטי
#   GET /images/<file>     -> קובצי תמונות סטטיים
server {
    listen 9000;
    server_name _;

    root /usr/share/nginx/html;

    location / {
        try_files $uri =404;
    }
}
